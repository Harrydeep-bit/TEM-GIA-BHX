name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file APK
        run: cp app/build/outputs/apk/release/app-release.apk InTemGia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InTemGia-apk
          path: InTemGia.apk

      - name: Tạo bản phát hành để tải APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: In Tem Giá - bản ${{ github.run_number }}
          body: Tải file InTemGia.apk bên dưới về điện thoại Android rồi cài đặt.
          files: InTemGia.apk
          make_latest: true
